<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - FerreControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <a href="../auth-login/auth.html"
                class="inline-flex items-center gap-1 text-primary hover:underline text-sm mb-4">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                Volver
            </a>
            <div
                class="inline-flex items-center justify-center w-16 h-16 bg-orange-100 text-orange-600 rounded-2xl mb-4">
                <span class="material-symbols-outlined text-4xl"
                    style="font-variation-settings: 'FILL' 1">construction</span>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Crea tu cuenta</h1>
            <p class="text-slate-500 mt-2">Registra tu ferretería en FerreControl</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <div class="space-y-1">
                <label class="text-sm font-semibold text-slate-700">Nombre de la Ferretería</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-400 text-xl">store</span>
                    <input type="text" id="companyName" required
                        class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition-all"
                        placeholder="Ej. Ferretería Central">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-sm font-semibold text-slate-700">RUC</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-400 text-xl">badge</span>
                    <input type="text" id="ruc" required maxlength="11"
                        class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition-all"
                        placeholder="RUC de 11 dígitos">
                </div>
            </div>

            <div class="h-px bg-slate-100 my-4"></div>

            <div class="space-y-1">
                <label class="text-sm font-semibold text-slate-700">Nombre del Administrador</label>
                <input type="text" id="fullName" required
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition-all"
                    placeholder="Tu nombre completo">
            </div>

            <div class="space-y-1">
                <label class="text-sm font-semibold text-slate-700">Usuario</label>
                <input type="text" id="username" required
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition-all"
                    placeholder="Ej. admin_ferre">
            </div>

            <div class="space-y-1">
                <label class="text-sm font-semibold text-slate-700">Contraseña</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none transition-all"
                    placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-orange-200 transition-all flex items-center justify-center gap-2">
                <span>Registrar y Comenzar</span>
                <span class="material-symbols-outlined">arrow_forward</span>
            </button>
        </form>

        <div class="mt-8 text-center text-slate-600 text-sm">
            ¿Ya tienes una cuenta?
            <a href="../auth-login/login.html" class="text-orange-600 font-bold hover:underline">Inicia Sesión</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="animate-spin material-symbols-outlined">progress_activity</span> Procesando...';

            const registerData = {
                companyName: document.getElementById('companyName').value,
                ruc: document.getElementById('ruc').value,
                username: document.getElementById('username').value,
                fullName: document.getElementById('fullName').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('http://127.0.0.1:8081/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(registerData)
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('tenantName', data.tenantName);
                    localStorage.setItem('role', data.role);

                    window.location.href = '../dashboard/dashboard.html';
                } else {
                    const error = await response.json();
                    alert('Error en el registro: ' + (error.message || 'Datos inválidos'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión con el servidor');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Registrar y Comenzar</span><span class="material-symbols-outlined">arrow_forward</span>';
            }
        });
    </script>
</body>

</html>
